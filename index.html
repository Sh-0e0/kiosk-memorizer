<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>키오스크 코드 암기</title>
<style>
:root{--bg:#f3f6fa;--card:#fff;--fg:#14202e;--mut:#5d6b7c;--bd:#d3dce7;--acc:#0b6e8a;--accfg:#fff;--ok:#12794a;--bad:#c0392b;--code:#eaf1f8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a26;--card:#172536;--fg:#e6edf5;--mut:#92a3b6;--bd:#2a3c50;--acc:#4cc2e0;--accfg:#06202b;--ok:#4fd18b;--bad:#ff8a7a;--code:#0c1620;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a26;--card:#172536;--fg:#e6edf5;--mut:#92a3b6;--bd:#2a3c50;--acc:#4cc2e0;--accfg:#06202b;--ok:#4fd18b;--bad:#ff8a7a;--code:#0c1620;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:24px;margin:0 0 4px}
p.s{color:var(--mut);margin:0 0 18px}
.mono,pre,input,textarea{font-family:"JetBrains Mono","D2Coding",Consolas,Menlo,monospace}
.modes{display:grid;gap:10px}
.mode{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;color:var(--fg);font:inherit;cursor:pointer}
.mode:hover,.mode:focus-visible{border-color:var(--acc);outline:2px solid var(--acc);outline-offset:0}
.mode b{display:block;font-size:17px}
.mode span{color:var(--mut);font-size:14px}
.row{display:flex;gap:10px;align-items:center;margin:0 0 16px;flex-wrap:wrap}
select,button.b{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
button.p{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
#ttl{font-weight:700;font-size:18px}
#prog{color:var(--mut);font-size:14px}
#barw{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:12px}
#bar{height:100%;width:0;background:var(--acc)}
pre{margin:0 0 12px;padding:14px 16px;background:var(--code);border:1px solid var(--bd);border-radius:8px;font-size:15px;line-height:1.55;overflow-x:auto;white-space:pre-wrap;min-height:54px}
#show.big{font-size:19px;padding:22px 16px}
#hint{border-color:var(--acc);color:var(--acc)}
#prev{max-height:220px;overflow:auto;color:var(--mut)}
input,textarea{width:100%;font-size:16px;padding:12px 14px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);margin-bottom:12px}
textarea{min-height:300px;resize:vertical;line-height:1.5;tab-size:4}
input:focus,textarea:focus{outline:2px solid var(--acc);border-color:var(--acc)}
#msg{white-space:pre-wrap;font-size:14px;min-height:0}
#msg.ok{color:var(--ok);border-color:var(--ok)}
#msg.bad{color:var(--bad);border-color:var(--bad)}
#emsg{white-space:pre-wrap;font-size:14px}
#emsg.ok{color:var(--ok);border-color:var(--ok)}
#emsg.bad{color:var(--bad);border-color:var(--bad)}
#tt{font-size:20px;margin:0}
#tn{color:var(--mut);font-size:14px}
.tc{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 18px;margin:8px 0 16px;min-height:200px}
.tc p{margin:12px 0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){#bar{transition:none!important}}
</style>
</head>
<body>
<main>
<section id="home">
  <h1>키오스크 코드 암기</h1>
  <p class="s">Menu부터 Main까지 7개 파일을 단계별로 외워요. 들여쓰기는 검사하지 않고, 글자·기호·띄어쓰기는 정확히 봅니다. 모든 단계에서 Tab 키는 공백 4칸이에요.</p>
  <div class="row"><label for="st">시작 파일 (1·2차)</label><select id="st"></select><button class="b" id="ed">코드 직접 입력·수정</button><button class="b" id="tb">사용법</button></div>
  <div class="modes">
    <button class="mode" data-m="1"><b>1차: 한 줄 보고 입력</b><span>한 줄을 5초 보여준 뒤 숨깁니다. 틀리면 그 클래스를 처음 줄부터 다시 해요.</span></button>
    <button class="mode" data-m="2"><b>2차: 클래스 이름만 보고 입력</b><span>백지에서 한 줄씩 입력해요. 5초간 입력이 없으면 정답 줄을 3초 보여줍니다.</span></button>
    <button class="mode" data-m="3"><b>3차: 클래스 전체 입력</b><span>클래스 하나를 다 쓰고 검사해요. 틀리면 틀린 줄과 정답을 알려주고 처음 클래스부터 다시 시작합니다.</span></button>
  </div>
</section>

<section id="tut" hidden>
  <div class="row"><button class="b" id="tclose">건너뛰기</button></div>
  <div class="top"><h1 id="tt"></h1><div id="tn"></div></div>
  <div class="tc" id="tbd"></div>
  <div class="row"><button class="b" id="tprev">이전</button><button class="b p" id="tnext">다음</button></div>
</section>

<section id="edit" hidden>
  <div class="row"><button class="b" id="eback">처음으로</button></div>
  <h1>코드 직접 입력</h1>
  <p class="s">파일을 고르고 외울 코드를 붙여 넣은 뒤 저장하세요. 저장한 코드로 1·2·3차가 모두 진행돼요. 빈 줄은 필드·생성자·메서드를 나눌 때 쓰면 1차 부분 보기에 쓰여요.</p>
  <div class="row"><label for="ef">파일</label><select id="ef"></select></div>
  <textarea id="ec" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="코드"></textarea>
  <div class="row"><button class="b p" id="esave">저장</button><button class="b" id="edef">기본 코드로 되돌리기</button></div>
  <pre id="emsg" hidden></pre>
</section>

<section id="run" hidden>
  <div class="row"><button class="b" id="back">처음으로</button></div>
  <div class="top"><div id="ttl"></div><div id="prog"></div></div>
  <div id="barw" hidden><div id="bar"></div></div>
  <div class="row" id="pvrow" hidden><label for="pv">내가 친 코드 보기</label><select id="pv"><option value="sec">현재 부분 (필드·생성자·메서드)</option><option value="line">바로 이전 줄</option><option value="all">지금까지 전부</option><option value="off">보지 않기</option></select></div>
  <pre id="prev" hidden></pre>
  <pre id="show"></pre>
  <pre id="hint" hidden></pre>
  <input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="입력">
  <textarea id="ta" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="클래스 코드 입력"></textarea>
  <div class="row"><button class="b p" id="go" hidden>검사하기 (Ctrl+Enter)</button></div>
  <pre id="msg" hidden></pre>
</section>
</main>

<script>
const S = {
"Menu.java": `public class Menu {
    String name;
    int price;

    Menu(String name, int price) {
        this.name = name;
        this.price = price;
    }

    void showInfo() {
        System.out.println(name + " " + price + "원");
    }

    int getPrice() {
        return price;
    }
}`,
"MemberGrade.java": `public enum MemberGrade {
    NORMAL(0), VIP(10);

    private final int discountRate;

    MemberGrade(int discountRate) {
        this.discountRate = discountRate;
    }

    int getDiscountRate() {
        return discountRate;
    }
}`,
"Cart.java": `public class Cart {
    Menu[] items = new Menu[10];
    int count = 0;
    MemberGrade grade = MemberGrade.NORMAL;

    void addMenu(Menu menu) {
        if (count >= 10) {
            System.out.println("장바구니가 가득 찼습니다.");
            return;
        }
        items[count] = menu;
        count++;
    }

    int calculateTotal() {
        int total = 0;
        for (int i = 0; i < count; i++) {
            total += items[i].getPrice();
        }
        return total;
    }

    void showCart() {
        if (count == 0) {
            System.out.println("장바구니가 비어 있습니다.");
            return;
        }
        for (int i = 0; i < count; i++) {
            items[i].showInfo();
        }
        System.out.println("총 주문 금액: " + calculateTotal() + "원");
    }

    void setMemberGrade(MemberGrade grade) {
        this.grade = grade;
    }

    int calculateFinalPrice() {
        int total = calculateTotal();
        int discount = total * grade.getDiscountRate() / 100;
        return total - discount;
    }
}`,
"Payment.java": `public class Payment {
    protected String paymentName;

    Payment(String paymentName) {
        this.paymentName = paymentName;
    }

    void pay(int amount) {
        System.out.println("결제 수단: " + paymentName);
        System.out.printf("결제 금액: %,d원%n", amount);
        System.out.println("결제가 완료되었습니다.");
    }
}`,
"CardPayment.java": `public class CardPayment extends Payment {
    int cardBalance;

    CardPayment(int cardBalance) {
        super("카드 결제");
        this.cardBalance = cardBalance;
    }

    @Override
    void pay(int amount) {
        if (cardBalance >= amount) {
            cardBalance -= amount;
            System.out.println("결제 수단: " + paymentName);
            System.out.printf("결제 금액: %,d원%n", amount);
            System.out.println("결제가 완료되었습니다.");
            System.out.printf("남은 카드 잔액: %,d원%n", cardBalance);
        } else {
            System.out.println("카드 잔액이 부족합니다.");
        }
    }
}`,
"SimplePayment.java": `public class SimplePayment extends Payment {
    int point;

    SimplePayment(int point) {
        super("간편결제");
        this.point = point;
    }

    @Override
    void pay(int amount) {
        int earned = amount * 5 / 100;
        point += earned;
        System.out.println("결제 수단: " + paymentName);
        System.out.printf("결제 금액: %,d원%n", amount);
        System.out.println("결제가 완료되었습니다.");
        System.out.printf("적립 포인트: %,dP%n", earned);
        System.out.printf("총 보유 포인트: %,dP%n", point);
    }
}`,
"Main.java": `import java.util.Scanner;

public class Main {
    public static void main(String[] args) {
        Menu m1 = new Menu("아메리카노", 3500);
        Menu m2 = new Menu("카페라떼", 4000);
        Menu m3 = new Menu("블루베리스무디", 4500);

        Cart cart = new Cart();
        cart.addMenu(m1);
        cart.addMenu(m2);
        cart.addMenu(m3);
        cart.setMemberGrade(MemberGrade.VIP);

        int finalPrice = cart.calculateFinalPrice();

        Scanner sc = new Scanner(System.in);
        System.out.println("결제 수단을 선택하세요. (1: 카드 결제, 2: 간편결제)");
        int choice = sc.nextInt();

        Payment payment;
        if (choice == 1) {
            payment = new CardPayment(20000);
        } else if (choice == 2) {
            payment = new SimplePayment(0);
        } else {
            System.out.println("잘못된 결제 수단입니다.");
            return;
        }

        payment.pay(finalPrice);
    }
}`};

const D = Object.assign({}, S), KEY = "kiosk-code-v1";
try {
  const o = JSON.parse(localStorage.getItem(KEY) || "{}");
  for (const k in o) if (k in S && typeof o[k] === "string" && o[k].trim()) S[k] = o[k];
} catch (e) {}
function persist() {
  try {
    const o = {}; names.forEach(n => { if (S[n] !== D[n]) o[n] = S[n]; });
    localStorage.setItem(KEY, JSON.stringify(o)); return true;
  } catch (e) { return false; }
}
const names = Object.keys(S);
const L = i => S[names[i]].split("\n").filter(l => l.trim());
const T = s => s.trim();
/* 빈 줄 기준으로 나눈 부분(필드·생성자·메서드) 번호 */
const SEC = i => { let s = 0; const r = []; S[names[i]].split("\n").forEach(l => { if (!l.trim()) s++; else r.push(s); }); return r; };
function prevText() {
  const v = $("pv").value, A = L(ci), sc = SEC(ci);
  if (v === "off" || li === 0) return "";
  const done = A.slice(0, li);
  if (v === "line") return done[li - 1];
  if (v === "all") return done.join("\n");
  const ids = done.map((_, k) => k);
  let idx = ids.filter(k => sc[k] === sc[li]);
  if (!idx.length) idx = ids.filter(k => sc[k] === sc[li - 1]);
  return idx.map(k => A[k]).join("\n");
}
function drawPrev() { const pt = prevText(); prev.hidden = !pt; prev.textContent = pt; }
const $ = id => document.getElementById(id);
const home = $("home"), run = $("run"), show = $("show"), hint = $("hint"), inp = $("inp"), ta = $("ta"),
  go = $("go"), msg = $("msg"), ttl = $("ttl"), prog = $("prog"), barw = $("barw"), bar = $("bar"), prev = $("prev");

names.forEach((n, i) => $("st").add(new Option(n, i)));
$("pv").onchange = () => {
  if (mode !== 1 || (inp.hidden && barw.hidden)) return;
  drawPrev(); if (!inp.hidden) inp.focus();
};

let mode = 0, ci = 0, li = 0, typed = [], timers = [], idle = null, hintOn = false, locked = false;

function clearAll() {
  timers.forEach(clearTimeout); timers = [];
  clearTimeout(idle); hintOn = false;
}
function later(fn, ms) { const t = setTimeout(fn, ms); timers.push(t); return t; }
function setMsg(text, cls) {
  msg.hidden = !text; msg.textContent = text || ""; msg.className = cls || "";
}
function reset() {
  clearAll(); locked = false;
  show.hidden = false; show.className = ""; show.textContent = "";
  hint.hidden = true; inp.hidden = true; inp.value = "";
  ta.hidden = true; ta.value = ""; go.hidden = true; barw.hidden = true; prev.hidden = true; setMsg("");
}
function finish() {
  reset();
  ttl.textContent = "모두 통과했어요";
  prog.textContent = "";
  show.textContent = "7개 파일을 끝까지 해냈어요. 다음 단계로 넘어가 보세요.";
}

home.querySelectorAll(".mode").forEach(b => b.onclick = () => {
  mode = +b.dataset.m;
  home.hidden = true; run.hidden = false;
  ci = mode === 3 ? 0 : +$("st").value;
  $("pvrow").hidden = mode !== 1;
  if (mode === 1) m1Start(); else if (mode === 2) m2Start(); else m3Start();
});
$("back").onclick = () => { reset(); run.hidden = true; home.hidden = false; };

/* 코드 직접 입력 */
const ef = $("ef"), ec = $("ec"), emsg = $("emsg");
names.forEach((n, i) => ef.add(new Option(n, i)));
const eshow = () => { ec.value = S[names[ef.value]]; };
function eMsg(t, c) { emsg.hidden = !t; emsg.textContent = t || ""; emsg.className = c || ""; }
$("ed").onclick = () => { home.hidden = true; $("edit").hidden = false; eshow(); eMsg(""); };
$("eback").onclick = () => { $("edit").hidden = true; home.hidden = false; };
ef.onchange = () => { eshow(); eMsg(""); };
$("esave").onclick = () => {
  const v = ec.value.replace(/\r\n/g, "\n").replace(/\s+$/, ""), n = names[ef.value];
  if (!v.trim()) return eMsg("코드가 비어 있어요. 내용을 입력하세요.", "bad");
  S[n] = v; const ok = persist(), cnt = v.split("\n").filter(l => l.trim()).length;
  eMsg(n + " 저장 완료 (" + cnt + "줄)" + (ok ? "" : "\n이 브라우저에는 저장할 수 없어서 이번 방문 동안만 유지돼요."), ok ? "ok" : "bad");
};
$("edef").onclick = () => {
  const n = names[ef.value]; S[n] = D[n]; persist(); eshow(); eMsg(n + " 기본 코드로 되돌렸어요.", "ok");
};
ec.addEventListener("keydown", e => {
  if (e.key === "Tab") { e.preventDefault(); ec.setRangeText("    ", ec.selectionStart, ec.selectionEnd, "end"); }
});

/* 사용법 튜토리얼 */
const TUT = [
  { t: "이 앱으로 하는 일", b: ["Menu부터 Main까지 7개 파일을 세 단계로 나눠 외워요.", "1차는 한 줄씩, 2차는 파일 이름만 보고, 3차는 파일 전체를 쳐요.", "들여쓰기와 빈 줄은 검사하지 않고, 글자·기호·띄어쓰기는 정확히 봅니다.", "입력창에서 Tab을 누르면 공백 4칸이 들어가요."] },
  { t: "1차 · 한 줄씩 보고 입력", b: ["한 줄이 5초 동안 크게 나오고, 위쪽 막대가 줄어들어요.", "막대가 끝나면 줄이 사라지고 입력창이 열려요. 외운 대로 치고 Enter를 누르세요.", "맞으면 다음 줄로, 틀리면 정답을 3초 보여준 뒤 그 파일의 첫 줄부터 다시 시작해요.", "위쪽 “내가 친 코드 보기”에서 현재 부분, 바로 이전 줄, 지금까지 전부, 보지 않기 중에 고를 수 있어요."] },
  { t: "2차 · 파일 이름만 보고 입력", b: ["파일 이름만 있는 백지에서 한 줄씩 입력해요. 맞게 친 줄은 위에 쌓여요.", "5초 동안 입력이 없으면 지금 칠 줄이 3초 동안 힌트로 나와요.", "틀리면 정답을 잠깐 보여주고 같은 줄을 다시 입력하게 해요.", "한 파일을 끝내면 다음 파일로 넘어가요."] },
  { t: "3차 · 파일 전체 입력", b: ["입력창에 파일 하나를 통째로 치고 검사하기(Ctrl+Enter)를 누르세요.", "틀린 줄마다 내가 쓴 것과 정답을 나란히 보여줘요.", "하나라도 틀리면 첫 번째 파일부터 다시 시작해요. 7개를 모두 통과하면 끝이에요."] },
  { t: "내 코드 넣기", b: ["홈 화면의 “코드 직접 입력·수정”에서 파일을 고르고, 내 코드를 붙여 넣은 뒤 저장하세요.", "저장한 코드는 이 브라우저에 남고, 1·2·3차가 모두 그 코드로 진행돼요.", "빈 줄로 필드·생성자·메서드를 나눠 두면 1차의 부분 보기가 잘 작동해요.", "“기본 코드로 되돌리기”로 파일별 원본을 복구할 수 있어요."] },
  { t: "추천 연습 순서", b: ["홈 화면의 “시작 파일”로 약한 파일부터 골라 시작할 수 있어요.", "1차는 “현재 부분” 보기로 시작하고, 익숙해지면 “바로 이전 줄”, 마지막엔 “보지 않기”로 줄여 가세요.", "2차로 파일별 빈칸을 채우고, 마지막에 3차를 한 번에 통과하는 게 목표예요.", "이 설명은 홈 화면의 “사용법” 버튼으로 언제든 다시 볼 수 있어요."] }
];
let tp = 0;
function drawTut() {
  const s = TUT[tp];
  $("tt").textContent = s.t; $("tn").textContent = (tp + 1) + " / " + TUT.length;
  $("tbd").replaceChildren(...s.b.map(x => { const p = document.createElement("p"); p.textContent = x; return p; }));
  $("tprev").disabled = tp === 0;
  $("tnext").textContent = tp === TUT.length - 1 ? "시작하기" : "다음";
}
function openTut() { tp = 0; home.hidden = true; $("tut").hidden = false; drawTut(); }
function closeTut() {
  $("tut").hidden = true; home.hidden = false;
  try { localStorage.setItem("kiosk-tut-v1", "1"); } catch (e) {}
}
$("tb").onclick = openTut;
$("tclose").onclick = closeTut;
$("tprev").onclick = () => { tp--; drawTut(); };
$("tnext").onclick = () => { if (tp === TUT.length - 1) closeTut(); else { tp++; drawTut(); } };
try { if (!localStorage.getItem("kiosk-tut-v1")) openTut(); } catch (e) {}

/* 1차: 한 줄씩 5초 보여주고 숨김 */
function m1Start() { li = 0; m1Line(); }
function m1Line() {
  reset();
  const A = L(ci);
  if (li >= A.length) { ci++; if (ci >= names.length) return finish(); li = 0; return m1Line(); }
  ttl.textContent = "1차 · " + names[ci];
  prog.textContent = (li + 1) + " / " + A.length + "줄";
  drawPrev();
  show.className = "big"; show.textContent = A[li];
  barw.hidden = false; bar.style.transition = "none"; bar.style.width = "100%";
  void bar.offsetWidth; bar.style.transition = "width 5s linear"; bar.style.width = "0";
  later(() => {
    barw.hidden = true; show.textContent = "줄이 사라졌어요. 외운 대로 입력하고 Enter를 누르세요.";
    inp.hidden = false; inp.value = ""; inp.focus();
  }, 5000);
}

/* 2차: 이름만 보고 백지에서 입력, 5초 무입력 시 3초 힌트 */
function m2Start() { li = 0; typed = []; m2Line(); }
function armIdle() { clearTimeout(idle); idle = setTimeout(showHint, 5000); }
function showHint() {
  hintOn = true; hint.hidden = false; hint.textContent = L(ci)[li];
  later(() => { hintOn = false; hint.hidden = true; armIdle(); }, 3000);
}
function m2Line() {
  reset();
  const A = L(ci);
  if (li >= A.length) { ci++; if (ci >= names.length) return finish(); li = 0; typed = []; return m2Line(); }
  ttl.textContent = "2차 · " + names[ci];
  prog.textContent = (li + 1) + " / " + A.length + "줄";
  show.textContent = typed.join("\n") || "// " + names[ci] + " 를 처음부터 써 보세요";
  inp.hidden = false; inp.focus(); armIdle();
}

/* 3차: 클래스 전체 입력 후 검사 */
function m3Start() { m3Cls(); }
function m3Cls(note) {
  reset();
  ttl.textContent = "3차 · " + names[ci];
  prog.textContent = (ci + 1) + " / " + names.length + "개 파일";
  show.textContent = names[ci] + " 전체를 입력하세요. 들여쓰기는 상관없어요. Tab 키는 공백 4칸입니다.";
  ta.hidden = false; ta.focus(); go.hidden = false; go.textContent = "검사하기 (Ctrl+Enter)";
  go.onclick = m3Check;
  if (note) setMsg(note, "ok");
}
function m3Check() {
  if (locked) return;
  const u = ta.value.split("\n").map(T).filter(Boolean), a = L(ci).map(T), out = [];
  for (let i = 0; i < Math.max(u.length, a.length); i++) {
    if (u[i] !== a[i]) out.push((i + 1) + "번째 줄\n  내가 쓴 것: " + (u[i] === undefined ? "(없음)" : u[i]) + "\n  정답: " + (a[i] === undefined ? "(필요 없음)" : a[i]));
    if (out.length >= 6) { out.push("…이후 줄도 다를 수 있어요"); break; }
  }
  if (!out.length) { ci++; return ci >= names.length ? finish() : m3Cls(names[ci - 1] + " 통과!"); }
  locked = true; ta.disabled = true;
  setMsg("틀린 부분이 있어요.\n\n" + out.join("\n\n") + "\n\n처음 클래스(" + names[0] + ")부터 다시 시작해야 해요.", "bad");
  go.textContent = "처음부터 다시"; go.onclick = () => { ta.disabled = false; ci = 0; m3Cls(); };
}
ta.addEventListener("keydown", e => {
  if (e.key === "Tab") {
    e.preventDefault();
    const s = ta.selectionStart; ta.setRangeText("    ", s, ta.selectionEnd, "end");
  } else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); if (!go.hidden) go.click(); }
});

/* 1·2차 입력 처리 */
inp.addEventListener("input", () => { if (mode === 2 && !hintOn) armIdle(); });
inp.addEventListener("keydown", e => {
  if (e.key === "Tab") {
    e.preventDefault();
    inp.setRangeText("    ", inp.selectionStart, inp.selectionEnd, "end");
    if (mode === 2 && !hintOn) armIdle();
    return;
  }
  if (e.key !== "Enter" || locked) return;
  const A = L(ci), ok = T(inp.value) === T(A[li]);
  if (mode === 1) {
    if (ok) { li++; return m1Line(); }
    locked = true; inp.disabled = true;
    show.className = "big"; show.textContent = "정답: " + A[li];
    setMsg("틀렸어요. " + names[ci] + "의 첫 줄부터 다시 시작합니다.", "bad");
    later(() => { inp.disabled = false; li = 0; m1Line(); }, 3000);
  } else {
    if (ok) { typed.push(A[li]); li++; return m2Line(); }
    inp.value = ""; setMsg("틀렸어요. 정답을 잠깐 보여줄게요. 다시 입력해 보세요.", "bad");
    clearAll(); showHint();
  }
});
</script>
</body>
</html>
